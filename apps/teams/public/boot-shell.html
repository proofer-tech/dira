<!doctype html>
<!-- 스켈레톤 셸 정본 (DESIGN.md P549 결정 5-6). 데스크톱 앱이 서버보다 먼저 loadFile로 그리고,
     /offline.html이 같은 마크업을 쓴다. 네트워크 요청 0, 폰트는 시스템 폰트다.
     입력은 쿼리 ?l=<layout.json 본문>이다(없거나 깨지면 기본: 라이트, 펼친 사이드바).
     모양을 바꾸면 이 파일 한 곳만 고친다. -->
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dira</title>
<style>
  :root { --bg: #fff; --bar: oklch(0.97 0 0); --line: oklch(0.922 0 0); --side: oklch(0.985 0 0); --fg: oklch(0.556 0 0) }
  html.dark { --bg: #0a0a0a; --bar: oklch(0.269 0 0); --line: oklch(0.269 0 0); --side: oklch(0.205 0 0); --fg: oklch(0.708 0 0) }
  * { box-sizing: border-box }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 -apple-system, system-ui, sans-serif }
  body { display: flex; flex-direction: column; overflow: hidden }
  header { height: 48px; flex: none; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 16px 0 80px; -webkit-app-region: drag }
  main { flex: 1; min-height: 0; display: flex; gap: 24px; padding: 16px 24px }
  aside { flex: none; width: 256px; display: flex; flex-direction: column; gap: 8px }
  aside.off { width: 40px }
  section { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px }
  .sk { background: var(--bar); border-radius: 6px; animation: p 1.6s ease-in-out infinite }
  @keyframes p { 50% { opacity: .5 } }
  .row { display: flex; gap: 16px; flex: 1; min-height: 0 }
  .row > .sk { flex: 1 }
  #note { display: none; margin: 0 }
</style>
<header><div class="sk" style="width:224px;height:32px"></div><div class="sk" style="width:96px;height:32px"></div><div class="sk" style="width:96px;height:32px"></div></header>
<main>
  <aside id="side"></aside>
  <section><div class="sk" style="height:32px;width:33%"></div><div class="row"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div><p id="note"></p></section>
</main>
<script>
  var l = {};
  try { l = JSON.parse(new URLSearchParams(location.search).get("l") || "{}") || {}; } catch (e) {}
  if (l.theme === "dark") document.documentElement.classList.add("dark");
  var sb = l.sidebar || {}, side = document.getElementById("side"), off = sb.collapsed === true;
  if (off) side.className = "off";
  else if (typeof sb.width === "number" && sb.width >= 160 && sb.width <= 480) side.style.width = sb.width + "px";
  for (var i = 0; i < (off ? 1 : 6); i++) { var d = document.createElement("div"); d.className = "sk"; d.style.height = "32px"; side.appendChild(d); }
  // 오프라인 셸이 같은 파일을 쓸 때만: ?note=<문구>
  var n = new URLSearchParams(location.search).get("note");
  if (n) { var p = document.getElementById("note"); p.textContent = n; p.style.display = "block"; }
</script>
</html>
