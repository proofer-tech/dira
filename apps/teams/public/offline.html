<!doctype html>
<!-- 오프라인 셸 (P549 결정 3, 6). 서비스 워커가 연결 실패한 화면 이동에 이 문서를 낸다.
     스켈레톤 마크업은 boot-shell.html 한 곳이 정본이라 여기서는 iframe으로 그것을 그린다. -->
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dira</title>
<style>html,body,iframe{margin:0;width:100%;height:100%;border:0;display:block}</style>
<iframe id="f" title="dira"></iframe>
<script>
  var l = "{}";
  try { l = localStorage.getItem("dira-layout") || "{}"; } catch (e) {}
  document.getElementById("f").src = "/boot-shell.html?l=" + encodeURIComponent(l) + "&note=" + encodeURIComponent("서버를 다시 시작하는 중입니다");
  // 5초마다 원래 주소를 다시 시도하고, 서버가 답하면 그 화면으로 돌아간다.
  setInterval(function () {
    fetch(location.href, { cache: "no-store" }).then(function (r) { if (r.ok) location.reload(); }).catch(function () {});
  }, 5000);
</script>
</html>
