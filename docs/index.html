<!--
  GitHub Pages가 master의 /docs를 소스로 https://proofer-tech.github.io/dira/ 를
  지금도 서빙하고 있다. 이 파일 없이 이 브랜치를 master에 합치면 그 주소가 그 순간
  404가 된다. 그래서 옛 543줄 랜딩 대신 새 사이트(dira.proofer.tech)로 보내는
  리다이렉트 한 장만 남겨 둔다. GitHub Pages는 정적이라 301을 낼 수 없어
  canonical + meta refresh 조합이 최선이다. GitHub Pages를 끄면 이 파일도 지워도 된다.
-->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>dira — 옮겼습니다</title>
<link rel="canonical" href="https://dira.proofer.tech/">
<meta http-equiv="refresh" content="0; url=https://dira.proofer.tech/">
</head>
<body>
<p>이 페이지는 <a href="https://dira.proofer.tech/">dira.proofer.tech</a>로 옮겼습니다.</p>
</body>
</html>
